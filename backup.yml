version: 1

settings:
  log_level: info
  log_file: /backup/backup.log
  backup_directory: /backup
  # Base des verrous : un verrou par profil (ex: /var/lock/backup-cli.solidtime.lock).
  # Profils différents = exécution en parallèle possible ; même profil = refusé s'il tourne déjà.
  lock_file: /var/lock/backup-cli.lock

  notifications:
    enabled: true
    slack_webhook_env: SLACK_WEBHOOK_URL

  # Dossier racine des applications : l'application « authentik » vit dans /opt/authentik.
  # Sert à restaurer la configuration (docker-compose, .env) avec `restore --application`.
  applications_root: /opt

  storage:
    rclone_config: /root/.config/rclone/rclone.conf
    # Convention : <racine>/<serveur>/<dossier>. Le nom du serveur (ici s001) est déduit de
    # 'remote' ; `restore --server s002` lit les mêmes dossiers sous backups/s002/.
    remote: s3backup:backups/s001/backup
    config_remote: s3backup:backups/s001/backup-configuration
    # server_name: s001   # à renseigner seulement si la déduction ci-dessus est fausse
    upload_max_duration: 6h
    config_max_duration: 12h

profiles:
  - name: authentik
    type: postgres
    enabled: true
    schedule: "0 0 * * *"
    source:
      container_name: authentik-postgresql-1
      username: authentik
      database: authentik
    retention:
      days: 14

  - name: ghost
    type: mysql
    enabled: true
    schedule: "0 0 * * *"
    source:
      container_name: ghost-cms-db-1
      username: root
      database: ghost
      password_env: GHOST_DB_PASSWORD
    compression:
      enabled: true
      algorithm: gzip
    retention:
      days: 14

  # Fichiers uploadés de l'application « ghost » (dossiers de volumes exclus du profil `configs`).
  # `application: ghost` les rattache à la base « ghost » : `restore --application ghost`
  # restaure la configuration, ces fichiers puis la base, ensemble.
  # Les chemins sont archivés en absolu et restaurés à leur emplacement d'origine
  # (propriétaires et permissions conservés quand la restauration est lancée en root).
  # - name: ghost-uploads
  #   type: filesystem
  #   application: ghost
  #   enabled: true
  #   schedule: "30 0 * * *"
  #   source:
  #     paths:
  #       - /opt/ghost/volumes/content
  #     exclude:
  #       - "*.part"
  #       - "*/cache/*"
  #   compression:
  #     enabled: true
  #     algorithm: zstd
  #   retention:
  #     days: 14

  - name: jms
    type: postgres
    enabled: true
    schedule: "0 0 * * *"
    source:
      container_name: jms_postgresql
      username: postgres
      database: jumpserver
    retention:
      days: 14

  - name: monitoring
    type: postgres
    enabled: true
    schedule: "0 0 * * *"
    source:
      container_name: monitoring-postgres-1
      username: tempus_admin
      database: tempus_security
    retention:
      days: 14

  - name: n8n
    type: postgres
    enabled: true
    schedule: "0 2 * * *"
    source:
      container_name: postgres-n8n
      username: n8n
      database: n8n
    retention:
      days: 14

  - name: solidtime
    type: postgres
    enabled: true
    schedule: "0 0 * * *"
    source:
      container_name: solidtime-database-1
      username: solidtime
      database: solidtime
    retention:
      days: 14

  - name: agent
    type: postgres
    enabled: true
    schedule: "0 0 * * *"
    source:
      container_name: ai-code-agent-postgres-1
      username: agent
      database: agent_platform
    retention:
      days: 14

  - name: configs
    type: restic
    enabled: true
    schedule: "0 0 * * *"
    source:
      restic_repository: /backup-configuration
      restic_password_file: /root/.restic-password
      tags:
        - configs
      pre_commands:
        - "dpkg --get-selections > /root/backup-script/packages.list"
        - "crontab -l > /root/backup-script/crontab-root.txt 2>/dev/null || true"
      paths:
        - /etc
        - /root/backup-script
        - /root/.qnap-credentials
        - /var/spool/cron/crontabs
        - /opt/authentik/traefik/
        - /opt/authentik/.env
      exclude:
        - "*.part"
    destination:
      # Indispensable : sans 'path', le dossier synchronisé vers S3 est /backup (les dumps)
      # et non le dépôt restic, qui ne serait alors jamais envoyé.
      path: /backup-configuration
      remote: s3backup:backups/s001/backup-configuration
      remote_sync: true
    retention:
      daily: 7
      weekly: 4
      monthly: 12

  # --- Exemples (décommenter et adapter) -----------------------------------
  #
  # MariaDB : utilise mariadb-dump (dump) et le client mariadb (restauration).
  # Compression réelle des dumps MySQL/MariaDB : gzip par défaut (.sql.gz), zstd (.sql.zst)
  # ou aucune (compression: { enabled: false } -> .sql). La restauration détecte le format seule.
  # - name: shop
  #   type: mariadb
  #   enabled: true
  #   schedule: "10 1 * * *"
  #   source:
  #     container_name: shop-db-1
  #     username: root
  #     database: shop
  #     password_env: SHOP_DB_PASSWORD
  #   compression: { enabled: true, algorithm: zstd }
  #   retention:
  #     days: 14
  #
  # MongoDB : mongodump --archive --gzip (archive .archive.gz) / mongorestore --drop.
  # `database` est optionnel : omis = toutes les bases. `auth_database` vaut "admin" par défaut.
  # Le mot de passe passe par la variable d'environnement (jamais dans les arguments).
  # - name: app-mongo
  #   type: mongo            # "mongodb" est accepté aussi
  #   enabled: true
  #   schedule: "20 1 * * *"
  #   source:
  #     container_name: app-mongo-1
  #     username: root
  #     password_env: MONGO_ROOT_PASSWORD
  #     auth_database: admin
  #     database: appdb
  #   retention:
  #     days: 14
