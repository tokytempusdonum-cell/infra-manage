[package]
name = "backup-cli"
version = "0.1.0"
edition = "2021"
authors = ["Tempus Team"]
description = "A robust, modular and scalable backup and restore CLI application"

[[bin]]
name = "backup-cli"
path = "src/main.rs"

[lib]
name = "backup_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
zstd = "0.13"
tar = "0.4"
glob = "0.3"
walkdir = "2.5"
fs2 = "0.4"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "2.10", features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3.14"
